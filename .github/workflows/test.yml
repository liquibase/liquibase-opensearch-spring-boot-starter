name: Build and Test

on:
  workflow_dispatch:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

jobs:

  authorize:
    environment: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository && 'external' || 'internal' }}
    runs-on: ubuntu-latest
    steps:
      - run: "true"

  build-test:
    needs: authorize
    uses: liquibase/build-logic/.github/workflows/os-extension-test.yml@main
    secrets: inherit
    with:
      java: "[ 21 ]"
      javaBuildVersion: 21
      # The integration tests start OpenSearch via testcontainers, which needs a
      # Docker daemon. GitHub's windows-latest runners have none, so every IT
      # errors with "Could not find a valid Docker environment" there.
      os: '["ubuntu-latest"]'
      runIntegrationTests: true

  dependabot:
    needs: build-test
    uses: liquibase/build-logic/.github/workflows/dependabot-automerge.yml@main
    secrets: inherit